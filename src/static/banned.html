<div class='container'>
    <div class='row'>
        <div class='col-md-8 offset-md-2 mt-5'>
            <div class='card border-danger'>
                <div class='card-header bg-danger text-white'>
                    <h4 class='mb-0'><i class='bi bi-shield-exclamation'></i> Konto gesperrt</h4>
                </div>
                <div class='card-body'>
                    <p>Dein Benutzerkonto wurde gesperrt.</p>
                    <p>Mögliche Gründe:</p>
                    <ul>
                        <li>Zu viele fehlgeschlagene Login-Versuche</li>
                        <li>Dein Konto wurde durch einen Administrator gesperrt</li>
                    </ul>
                    <p>Bitte kontaktiere den Support, um dein Konto wieder freizuschalten:</p>
                    <p>
                        <a href="#{get_support_mailto('account_banned')}" class="btn btn-primary">
                            <i class="bi bi-envelope"></i>&nbsp;&nbsp;Support kontaktieren (#{SUPPORT_EMAIL})
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
